name: Linux

on:
  push:
    branches: [ main, refactor/dod_ecs ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main, refactor/dod_ecs ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          # GAMECOE_GRAPHICS_VERSION_MINOR=5 below: Mesa's llvmpipe software rasterizer (used via
          # Xvfb, see the "Run tests" step) caps at OpenGL 4.5 core, below gamecoe's real 4.6
          # default - CI-only override so window tests actually execute here instead of skipping.
          # Linux with GCC
          - name: "Linux GCC"
            compiler: gcc
            cmake-generator: 'Ninja'
            cmake-options: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DGAMECOE_USE_TESTCOE=ON -DGAMECOE_GLFW_WAYLAND=OFF -DGAMECOE_GRAPHICS_VERSION_MINOR=5'

          # Linux with Clang (libc++, not libstdc++ - libstdc++'s <expected> is incompatible with Clang)
          - name: "Linux Clang"
            compiler: clang
            cmake-generator: 'Ninja'
            cmake-options: '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ -DGAMECOE_USE_TESTCOE=ON -DGAMECOE_GLFW_WAYLAND=OFF -DGAMECOE_GRAPHICS_VERSION_MINOR=5'
            extra-packages: 'libc++-dev libc++abi-dev'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build xvfb xorg-dev libgl1-mesa-dev libglu1-mesa-dev ${{ matrix.extra-packages }}
      shell: bash

    - name: Configure CMake
      run: |
        cmake -B build -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }}

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Run tests
      working-directory: build
      run: |
        echo "Running gamecoe tests"
        xvfb-run -a ./tests/gamecoe_tests
      shell: bash
