name: Linux

on:
  push:
    branches: [ main, refactor/dod_ecs ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main, refactor/dod_ecs ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    env:
      # Mesa's llvmpipe software rasterizer (used via Xvfb, see the "Run tests" step) caps at
      # OpenGL 4.5 core, below gamecoe's real 4.6 default - CI-only override so window tests
      # actually execute here instead of skipping.
      GAMECOE_HEADLESS_GL_MAJOR: 4
      GAMECOE_HEADLESS_GL_MINOR: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux with GCC
          - name: "Linux GCC"
            compiler: gcc
            cmake-generator: 'Ninja'
            cmake-options: '-DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16 -DGAMECOE_USE_TESTCOE=ON -DGAMECOE_GLFW_WAYLAND=OFF'

          # Linux with Clang (libc++, not libstdc++ - libstdc++'s <expected> is incompatible with Clang)
          - name: "Linux Clang"
            compiler: clang
            cmake-generator: 'Ninja'
            cmake-options: '-DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ -DGAMECOE_USE_TESTCOE=ON -DGAMECOE_GLFW_WAYLAND=OFF'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build xvfb xorg-dev libgl1-mesa-dev libglu1-mesa-dev libgl1-mesa-dri
      shell: bash

    - name: Install audio dev libraries
      run: |
        sudo apt-get install -y libasound2-dev libpulse-dev libpipewire-0.3-dev
      shell: bash

    - name: Install GCC 16
      if: matrix.compiler == 'gcc'
      run: |
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo apt-get install -y gcc-16 g++-16
      shell: bash

    - name: Install Clang 22
      if: matrix.compiler == 'clang'
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 22
        sudo apt-get install -y libc++-22-dev libc++abi-22-dev
      shell: bash

    - name: Configure CMake
      run: |
        GL_VERSION_FLAGS="-DGAMECOE_GRAPHICS_VERSION_MAJOR=$GAMECOE_HEADLESS_GL_MAJOR -DGAMECOE_GRAPHICS_VERSION_MINOR=$GAMECOE_HEADLESS_GL_MINOR"
        cmake -B build -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }} $GL_VERSION_FLAGS

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Configure CMake (toolkit libraries)
      run: |
        GL_VERSION_FLAGS="-DGAMECOE_GRAPHICS_VERSION_MAJOR=$GAMECOE_HEADLESS_GL_MAJOR -DGAMECOE_GRAPHICS_VERSION_MINOR=$GAMECOE_HEADLESS_GL_MINOR"
        TOOLKIT_FLAGS="-DGAMECOE_USE_SOUNDCOE=ON -DGAMECOE_USE_LOGCOE=ON"
        if [ "${{ matrix.compiler }}" == "clang" ]; then
          # OpenAL-Soft's vendored fmt 11.1.1 uses malloc/free without including <cstdlib> itself,
          # which libc++ (unlike libstdc++) doesn't pull in transitively here - force-include it.
          cmake -B build-toolkit -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }} $TOOLKIT_FLAGS $GL_VERSION_FLAGS -DCMAKE_CXX_FLAGS="-stdlib=libc++ -include cstdlib"
        else
          cmake -B build-toolkit -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }} $TOOLKIT_FLAGS $GL_VERSION_FLAGS
        fi

    - name: Build (toolkit libraries)
      run: |
        cmake --build build-toolkit --config Release

    - name: Run tests
      working-directory: build
      run: |
        echo "Running gamecoe tests"
        set -o pipefail
        xvfb-run -a ./tests/gamecoe_tests | tee test_output.log
        # testcoe currently reports a skipped test as failed. Narrow this back to skips only
        # once testcoe distinguishes the two in its output.
        if grep -qE 'Test Suite: (WindowTests|GameTests|GameMoveTests|GraphicsBufferTests|VertexArrayTests|ShaderTests|TextureTests)' test_output.log; then
          echo "::error::A GL-dependent test suite failed or was skipped - GL context creation may have failed unexpectedly in CI"
          exit 1
        fi
      shell: bash
