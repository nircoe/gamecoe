name: macOS

on:
  push:
    branches: [ main, refactor/dod_ecs ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main, refactor/dod_ecs ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    env:
      # Apple's OpenGL implementation caps at 4.1 core, below gamecoe's real 4.6 default
      GAMECOE_HEADLESS_GL_MAJOR: 4
      GAMECOE_HEADLESS_GL_MINOR: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS with Apple Clang
          - name: "macOS Clang"
            compiler: clang
            cmake-generator: 'Ninja'
            cmake-options: '-DGAMECOE_USE_TESTCOE=ON'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install ninja-build
      run: |
        brew install ninja
      shell: bash

    - name: Configure CMake
      run: |
        GL_VERSION_FLAGS="-DGAMECOE_GRAPHICS_VERSION_MAJOR=$GAMECOE_HEADLESS_GL_MAJOR -DGAMECOE_GRAPHICS_VERSION_MINOR=$GAMECOE_HEADLESS_GL_MINOR"
        cmake -B build -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }} $GL_VERSION_FLAGS

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Run tests
      working-directory: build
      run: |
        echo "Running gamecoe tests"
        # No accelerated GPU on GitHub's macOS runner, so GL-dependent suites skip here by design.
        ./tests/gamecoe_tests
      shell: bash
