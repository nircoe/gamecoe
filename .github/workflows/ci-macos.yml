name: macOS

on:
  push:
    branches: [ main, refactor/dod_ecs ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main, refactor/dod_ecs ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    env:
      # Apple's OpenGL implementation caps at 4.1 core, below gamecoe's real 4.6 default
      GAMECOE_HEADLESS_GL_MAJOR: 4
      GAMECOE_HEADLESS_GL_MINOR: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS with Apple Clang
          - name: "macOS Clang"
            compiler: clang
            cmake-generator: 'Ninja'
            cache-cmake-options: '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install ninja-build
      run: |
        brew install ninja
      shell: bash

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{
          hashFiles('cmake/glfw.cmake', 'cmake/glad.cmake', 'cmake/glm.cmake',
          'cmake/testcoe.cmake', 'cmake/logcoe.cmake', 'cmake/soundcoe.cmake') }}
        restore-keys: ccache-${{ runner.os }}-${{ matrix.compiler }}-

    - name: Configure CMake
      run: |
        GL_VERSION_FLAGS="-DGAMECOE_GRAPHICS_VERSION_MAJOR=$GAMECOE_HEADLESS_GL_MAJOR -DGAMECOE_GRAPHICS_VERSION_MINOR=$GAMECOE_HEADLESS_GL_MINOR"
        BUILD_TYPE_FLAG="-DCMAKE_BUILD_TYPE=Release"
        CACHE_FLAGS="${{ matrix.cache-cmake-options }}"
        CMAKE_FEATURE_FLAGS="-DGAMECOE_USE_SOUNDCOE=ON -DGAMECOE_USE_LOGCOE=ON -DGAMECOE_USE_TESTCOE=ON"
        cmake -B build -G "${{ matrix.cmake-generator }}" $BUILD_TYPE_FLAG $CACHE_FLAGS \
          $CMAKE_FEATURE_FLAGS $GL_VERSION_FLAGS

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Run tests
      working-directory: build
      run: |
        echo "Running gamecoe tests"
        # No accelerated GPU on GitHub's macOS runner, so GL-dependent suites skip here by design.
        ./tests/gamecoe_tests
      shell: bash
