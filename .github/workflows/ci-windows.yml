name: Windows

on:
  push:
    branches: [ main, refactor/dod_ecs ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main, refactor/dod_ecs ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows with MSVC
          - name: "Windows MSVC"
            compiler: msvc
            cmake-generator: ''
            cmake-options: '-DGAMECOE_USE_TESTCOE=ON -DGAMECOE_GRAPHICS_VERSION_MINOR=5'

          # Windows with MinGW (GCC)
          - name: "Windows MinGW"
            compiler: gcc
            cmake-generator: 'MinGW Makefiles'
            cmake-options: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DGAMECOE_USE_TESTCOE=ON -DGAMECOE_GRAPHICS_VERSION_MINOR=5'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Install Windows build tools
      if: matrix.compiler != 'msvc'
      run: |
        if [ "${{ matrix.compiler }}" == "clang" ]; then
          choco install ninja
        elif [ "${{ matrix.compiler }}" == "gcc" ]; then
          choco install mingw
        fi
      shell: bash


    - name: Configure CMake
      run: |
        if [ -n "${{ matrix.cmake-generator }}" ]; then
          cmake -B build -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }}
        else
          cmake -B build ${{ matrix.cmake-options }}
        fi
      shell: bash

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Install Mesa software OpenGL
      working-directory: build
      shell: pwsh
      run: |
        # Mesa's llvmpipe software rasterizer caps at OpenGL 4.5 core (see GAMECOE_GRAPHICS_VERSION_MINOR=5 above) -
        # GitHub's Windows runners only ship a legacy ~1.1 fallback driver otherwise.
        curl.exe -L --output mesa3d.7z --url https://github.com/pal1000/mesa-dist-win/releases/download/26.2.0/mesa3d-26.2.0-release-msvc.7z
        C:\'Program Files'\7-Zip\7z.exe x mesa3d.7z
        New-Item -ItemType Directory -Force -Path tests, tests\Release | Out-Null
        Copy-Item .\x64\opengl32.dll, .\x64\libglapi.dll, .\x64\libgallium_wgl.dll -Destination tests
        Copy-Item .\x64\opengl32.dll, .\x64\libglapi.dll, .\x64\libgallium_wgl.dll -Destination tests\Release
        echo "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Run tests
      working-directory: build
      run: |
        if [ "${{ matrix.compiler }}" == "gcc" ]; then
            # For MinGW - copy DLLs directly (no PATH manipulation)
            GCC_DIR=$(dirname $(which gcc))
            echo "GCC directory: $GCC_DIR"
            echo "Copying DLLs from $GCC_DIR"
            cp "$GCC_DIR"/libgcc*.dll tests/ 2>/dev/null || echo "No libgcc DLLs found"
            cp "$GCC_DIR"/libstdc*.dll tests/ 2>/dev/null || echo "No libstdc DLLs found"
            cp "$GCC_DIR"/libwinpthread*.dll tests/ 2>/dev/null || echo "No libwinpthread DLLs found"
            echo "Running gamecoe tests"
            cd tests
            ./gamecoe_tests.exe
        else # MSVC
            echo "Running gamecoe tests"
            ./tests/Release/gamecoe_tests.exe
        fi
      shell: bash
