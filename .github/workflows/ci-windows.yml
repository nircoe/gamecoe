name: Windows

on:
  push:
    branches: [ main, refactor/dod_ecs ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main, refactor/dod_ecs ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    env:
      # Mesa's llvmpipe software rasterizer caps at OpenGL 4.5 core - GitHub's Windows runners
      # only ship a legacy ~1.1 fallback driver otherwise, so window tests need this override to
      # actually execute here instead of skipping.
      GAMECOE_HEADLESS_GL_MAJOR: 4
      GAMECOE_HEADLESS_GL_MINOR: 5
      MESA_VERSION: 26.2.0
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows with MSVC
          - name: "Windows MSVC"
            compiler: msvc
            cmake-generator: ''
            cmake-options: '-DGAMECOE_USE_TESTCOE=ON'

          # Windows with MinGW (GCC)
          - name: "Windows MinGW"
            compiler: gcc
            cmake-generator: 'MinGW Makefiles'
            cmake-options: '-DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DGAMECOE_USE_TESTCOE=ON'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Install Windows build tools
      if: matrix.compiler != 'msvc'
      run: |
        if [ "${{ matrix.compiler }}" == "clang" ]; then
          choco install ninja
        elif [ "${{ matrix.compiler }}" == "gcc" ]; then
          choco install mingw
        fi
      shell: bash

    - name: Cache Mesa software OpenGL
      id: mesa-cache
      uses: actions/cache@v4
      with:
        path: mesa3d-cache
        key: mesa3d-${{ env.MESA_VERSION }}-x64

    - name: Start Mesa download
      if: steps.mesa-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        # Detached OS process (not a PowerShell background job) so it survives into later steps -
        # started here, before Configure/Build, so the download overlaps with them instead of
        # adding its own wall-clock time on top.
        $proc = Start-Process -FilePath curl.exe -ArgumentList `
          '-L', '--fail', '--output', 'mesa3d.7z', '--url', `
          "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z" `
          -PassThru -RedirectStandardOutput mesa_download.log -RedirectStandardError mesa_download.err.log
        $proc.Id | Out-File -FilePath mesa_download.pid

    - name: Configure CMake
      run: |
        GL_VERSION_FLAGS="-DGAMECOE_GRAPHICS_VERSION_MAJOR=$GAMECOE_HEADLESS_GL_MAJOR -DGAMECOE_GRAPHICS_VERSION_MINOR=$GAMECOE_HEADLESS_GL_MINOR"
        if [ -n "${{ matrix.cmake-generator }}" ]; then
          cmake -B build -G "${{ matrix.cmake-generator }}" ${{ matrix.cmake-options }} $GL_VERSION_FLAGS
        else
          cmake -B build ${{ matrix.cmake-options }} $GL_VERSION_FLAGS
        fi
      shell: bash

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Finish Mesa download
      if: steps.mesa-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        # The download almost always finishes during Configure/Build above, so its process has
        # already exited (and been reaped) by the time we get here - Get-Process + SilentlyContinue
        # avoids Wait-Process throwing on the now-common "already gone" case.
        $proc = Get-Process -Id (Get-Content mesa_download.pid) -ErrorAction SilentlyContinue
        if ($proc) { $proc | Wait-Process }
        Get-Content mesa_download.err.log
        if (-not (Test-Path mesa3d.7z) -or (Get-Item mesa3d.7z).Length -eq 0) {
          Write-Error "Mesa download failed - mesa3d.7z missing or empty"
          exit 1
        }
        C:\'Program Files'\7-Zip\7z.exe x mesa3d.7z -omesa3d-cache

    - name: Install Mesa software OpenGL
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path build\tests, build\tests\Release | Out-Null
        foreach ($dir in 'build\tests', 'build\tests\Release') {
          Copy-Item mesa3d-cache\x64\*.dll -Destination $dir
        }
        echo "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Run tests
      working-directory: build
      run: |
        set -o pipefail
        if [ "${{ matrix.compiler }}" == "gcc" ]; then
            # For MinGW - copy DLLs directly (no PATH manipulation)
            GCC_DIR=$(dirname $(which gcc))
            echo "GCC directory: $GCC_DIR"
            echo "Copying DLLs from $GCC_DIR"
            cp "$GCC_DIR"/libgcc*.dll tests/ 2>/dev/null || echo "No libgcc DLLs found"
            cp "$GCC_DIR"/libstdc*.dll tests/ 2>/dev/null || echo "No libstdc DLLs found"
            cp "$GCC_DIR"/libwinpthread*.dll tests/ 2>/dev/null || echo "No libwinpthread DLLs found"
            echo "Running gamecoe tests"
            cd tests
            ./gamecoe_tests.exe | tee test_output.log
            if grep -qE '\[  SKIPPED \] (WindowTests|GameTests|GameMoveTests|GraphicsBufferTests|VertexArrayTests|ShaderTests|TextureTests)' test_output.log; then
              echo "::error::A GL-dependent test suite was skipped - GL context creation failed unexpectedly in CI"
              exit 1
            fi
        else # MSVC
            echo "Running gamecoe tests"
            ./tests/Release/gamecoe_tests.exe | tee test_output.log
            if grep -qE '\[  SKIPPED \] (WindowTests|GameTests|GameMoveTests|GraphicsBufferTests|VertexArrayTests|ShaderTests|TextureTests)' test_output.log; then
              echo "::error::A GL-dependent test suite was skipped - GL context creation failed unexpectedly in CI"
              exit 1
            fi
        fi
      shell: bash
